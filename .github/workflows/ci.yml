name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s .github/scripts
      - run: python .github/scripts/build_index.py --check

  units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: make test in every unit
        # ponytail: runs every unit on every push; filter by changed paths when this gets slow
        run: |
          shopt -s nullglob
          failed=()
          for makefile in @*/*/0[1-3]-*/[0-9][0-9]-*/Makefile; do
            unit=$(dirname "$makefile")
            echo "::group::$unit"
            make -C "$unit" test || failed+=("$unit")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            printf '::error::%s failed\n' "${failed[@]}"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
